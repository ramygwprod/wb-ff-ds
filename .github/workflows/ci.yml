# CI: the independent check. A PR is only "done" when this passes ("CI decides").
# Actions are pinned by full commit SHA (supply-chain hardening); the tag is in the comment.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: read-only by default
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, audit, lint, build, test
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 (GitHub notice, 2026-10-19)
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use the pinned npm (package.json "packageManager")
        run: |
          NPM_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1]")
          npm install -g "npm@${NPM_VERSION}"
          echo "node $(node -v), npm $(npm -v)"

      # Lockfile only; .npmrc rules apply (strict install scripts, engines)
      - name: Clean install
        run: npm ci

      - name: Verify registry signatures and provenance
        run: npm audit signatures

      # Fails on any advisory except those accepted in this list (each one recorded in the release changelog)
      - name: Audit dependencies (accepted exceptions only)
        env:
          ACCEPTED_ADVISORIES: |
            GHSA-g3hv-75wg-m249
        run: |
          npm audit --json > audit.json || true
          node -e '
            const audit = require("./audit.json");
            const accepted = new Set(process.env.ACCEPTED_ADVISORIES.split(/\s+/).filter(Boolean));
            const found = new Map();
            for (const v of Object.values(audit.vulnerabilities || {})) {
              for (const via of v.via) {
                if (typeof via === "object" && via.url) found.set(via.url.split("/").pop(), `${via.name}: ${via.title} (${via.severity})`);
              }
            }
            const blocking = [...found].filter(([id]) => !accepted.has(id));
            for (const [id, d] of found) console.log(`${accepted.has(id) ? "accepted" : "BLOCKING"}  ${id}  ${d}`);
            for (const id of accepted) if (!found.has(id)) console.log(`::warning::Accepted advisory ${id} no longer reported. Remove it from the list.`);
            if (blocking.length) { console.error(`::error::${blocking.length} unaccepted advisory(ies)`); process.exit(1); }
            console.log(`OK: ${found.size} advisory(ies), all accepted`);
          '

      - name: Lint
        run: npx ng lint

      # The library first: the docs site consumes its build output (dist/wb-ff-ds)
      - name: Build library (wb-ff-ds)
        run: npx ng build wb-ff-ds

      - name: Build docs site (ferrofluid-ds)
        run: npx ng build ferrofluid-ds

      # ng test errors for a project with no test files, so each project is tested once it has some.
      # Make the library's tests unconditional once its first component exists.
      - name: Unit tests
        run: |
          for project in wb-ff-ds ferrofluid-ds; do
            if find "projects/${project}" -name '*.spec.ts' | grep -q .; then
              npx ng test "${project}" --watch=false
            else
              echo "::notice::${project}: no test files yet. Tests skipped until its first component exists."
            fi
          done

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 (GitHub notice, 2026-10-19)
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Review dependency changes in this PR
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          allow-ghsas: GHSA-g3hv-75wg-m249
          comment-summary-in-pr: on-failure
