# Deploy the docs site (ferrofluid-ds) to GitHub Pages.
# Runs only on main. The branch rules only let merges that passed CI reach main.
# Actions are pinned by full commit SHA; the tag is in the comment.
name: Pages

on:
  push:
    branches: [main]

# Least privilege by default; only the deploy job may publish
permissions:
  contents: read

# One deployment at a time; never cancel a deployment that's running
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 (GitHub notice, 2026-10-19)
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use the pinned npm (package.json "packageManager")
        run: |
          NPM_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1]")
          npm install -g "npm@${NPM_VERSION}"

      - name: Clean install
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build library (wb-ff-ds)
        run: npx ng build wb-ff-ds

      # The base path comes from Pages itself (e.g. /wb-ff-ds/), so it stays correct if the URL changes
      - name: Build docs site (ferrofluid-ds)
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npx ng build ferrofluid-ds --base-href "${BASE_PATH}/"

      # GitHub Pages has no SPA fallback: serving index.html as 404.html makes deep links and refreshes work
      - name: Add SPA fallback
        run: cp dist/ferrofluid-ds/browser/index.html dist/ferrofluid-ds/browser/404.html

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/ferrofluid-ds/browser

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 (GitHub notice, 2026-10-19)
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
